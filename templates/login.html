<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Log in — Dimi UL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body class="auth-body">
  <div class="auth-wrap">
    <div class="auth-hero">
      <span class="brand-mark big">💪</span>
      <h1 class="auth-title">Dimi UL</h1>
      <p class="auth-sub">Your Upper / Lower training log.</p>
    </div>
    <div class="card auth-card">
      <h2 class="auth-card-title">Welcome back</h2>
      {% if error %}<div class="alert">{{ error }}</div>{% endif %}
      <form method="post" action="/login">
        <label class="field">
          <span class="field-label">Username</span>
          <input class="input" type="text" name="username" value="{{ username }}" autocomplete="username" required />
        </label>
        <label class="field">
          <span class="field-label">Password</span>
          <input class="input" type="password" name="password" autocomplete="current-password" required />
        </label>
        <button class="btn btn-primary btn-block" type="submit">Log in</button>
      </form>
      <p class="auth-alt">No account yet? <a href="/register">Create one</a></p>
    </div>
  </div>
</body>
</html>
